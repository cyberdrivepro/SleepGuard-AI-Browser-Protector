<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SleepGuard AI Companion</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background-color: #07090E;
      color: #F0F4FC;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF2E93, #FF0844);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    h2 {
      font-size: 1rem;
      margin: 0;
    }
    p {
      font-size: 0.78rem;
      color: #8E9BAE;
      margin: 0;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00E676;
      box-shadow: 0 0 8px #00E676;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #00F2FE, #4FACFE);
      color: #07090E;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">❤️</div>
    <div>
      <h2>SleepGuard AI</h2>
      <p>Browser Close Companion</p>
    </div>
  </div>

  <div class="status-card">
    <div class="dot"></div>
    <div>
      <strong style="font-size: 0.85rem;">Bridge Active</strong>
      <p style="font-size: 0.72rem;">Listening for AI sleep signals</p>
    </div>
  </div>

  <button class="btn" id="testBtn">Test Tab Close</button>

  <script src="popup.js"></script>
</body>
</html>
